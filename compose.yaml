services:
  catalog:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_USER: iceberg
      POSTGRES_DB: iceberg
      POSTGRES_PASSWORD: ${CATALOG_PASSWORD}
    volumes:
      - catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "iceberg"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  site:
    image: docker.io/library/caddy:2
    command: caddy file-server --root /srv --listen :8080
    volumes:
      - ./site:/srv:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

  pipeline:
    build:
      context: .
      dockerfile: Containerfile
    profiles: ["jobs"]
    environment:
      PLATFORM_ROOT: /platform
      CATALOG_URI: postgresql+psycopg2://iceberg:${CATALOG_PASSWORD}@catalog:5432/iceberg
      DUCKDB_MEMORY_LIMIT: 1500MB
    volumes:
      - ./data:/platform/data
      - ./site:/platform/site
    depends_on:
      - catalog

volumes:
  catalog-data:
